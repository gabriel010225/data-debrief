"7457678121765560320":{domain:"modeling",also:["semantic"],series:"targets",fig:"fanout",stack:["SQL","BigQuery","Looker"],concepts:["targets","fanout","grain"],
en:{title:"Actuals vs targets, phase 2: unpivot, then beat the fan-out",
 tldr:"Budgets arrive as 12 monthly columns and at a coarser grain than sales. Unpivot them into rows, then make sure a monthly target is not repeated on every daily sales row.",
 context:"Reconciling targets with actuals is a modelling challenge with two recurring obstacles: the shape of the budget file, and the difference in granularity between the two datasets.",
 problem:"Budgets often come wide: one row per product and one column per month. And when sales are daily but targets monthly, a plain join copies the monthly target onto every daily row, so summing it multiplies the target by the number of days (the fan-out effect).",
 approach:["UNPIVOT the twelve monthly columns into rows so targets line up with the time dimension of actuals.","SQL option: use ROW_NUMBER() to keep the target value only on the first row of each month. It works, but it is fragile and hard to maintain when filters or grain change.","BI option (Looker): rely on symmetric aggregates with primary keys, which de-duplicate the target automatically. This is the most robust choice."],
 principles:[["Normalise shape before joining","Wide spreadsheets should become long tables before they meet transactional data."],["Know the grain of both sides","Joining a coarse table to a fine one duplicates the coarse values."],["Prefer mechanisms over tricks","A semantic layer that handles de-duplication beats hand-written window logic."]]},
zh:{title:"实际 vs 目标（第二阶段）：先逆透视，再解决扇出",
 tldr:"预算通常是 12 个月份列，而且粒度比销售数据粗。先把它逆透视成行，再确保月度目标不会被复制到每一条日销售记录上。",
 context:"把目标和实际对上，是一个建模难题，反复出现两个障碍：预算文件的形状，以及两份数据的粒度差异。",
 problem:"预算常常是「宽表」：每个产品一行，每个月一列。而当销售是按天、目标是按月时，直接关联会把月度目标复制到每一条日记录上，一求和，目标就被乘以了天数（扇出效应）。",
 approach:["用 UNPIVOT 把 12 个月份列转成行，让目标与实际数据的时间维度对齐。","SQL 方案：用 ROW_NUMBER() 只在每月第一行保留目标值。能用，但很脆弱，筛选或粒度一变就难以维护。","BI 方案（Looker）：依靠带主键的对称聚合（symmetric aggregates）自动去重。这是最稳健的选择。"],
 principles:[["关联之前先统一形状","宽格式的表格应先转成长表，再和交易数据相遇。"],["弄清两边的粒度","粗粒度表关联细粒度表，会复制粗粒度的值。"],["机制优于技巧","能自动去重的语义层，胜过手写的窗口函数逻辑。"]]},
fr:{title:"Réel vs objectifs, phase 2 : unpivot, puis éviter le fan-out",
 tldr:"Les budgets arrivent en 12 colonnes mensuelles et à une granularité plus grossière que les ventes. Les passer en lignes, puis s'assurer qu'un objectif mensuel n'est pas répété sur chaque vente quotidienne.",
 context:"Réconcilier objectifs et réalisé est un défi de modélisation avec deux obstacles récurrents : la forme du fichier budget, et l'écart de granularité entre les deux jeux de données.",
 problem:"Les budgets arrivent souvent « wide » : une ligne par produit et une colonne par mois. Et quand les ventes sont quotidiennes mais les objectifs mensuels, une jointure simple recopie l'objectif sur chaque ligne du jour : en sommant, on multiplie l'objectif par le nombre de jours (effet fan-out).",
 approach:["UNPIVOT des douze colonnes mensuelles en lignes pour aligner les objectifs sur la dimension temps du réalisé.","Option SQL : ROW_NUMBER() pour n'attribuer l'objectif qu'à la première ligne du mois. Cela marche, mais c'est fragile et difficile à maintenir quand les filtres ou le grain changent.","Option BI (Looker) : les Symmetric Aggregates avec clés primaires dédoublonnent automatiquement. C'est la solution la plus robuste."],
 principles:[["Normaliser la forme avant de joindre","Un tableur « wide » doit devenir une table « long » avant de rencontrer les transactions."],["Connaître le grain des deux côtés","Joindre une table grossière à une table fine duplique les valeurs grossières."],["Préférer les mécanismes aux astuces","Une couche sémantique qui dédoublonne bat une logique de fenêtrage écrite à la main."]]}},

/* I. Orchestration brain vs arms (04-30) */
"7455496222523535360":{domain:"orchestration",also:[],fig:"brain",stack:["Kestra","Prefect","Airflow","Dataproc","Kubernetes","Snowflake"],concepts:["orchestrator","dag"],
en:{title:"Orchestration: separate the brain from the arms",
 tldr:"An orchestrator should decide when and in what order tasks run, not always run the heavy work itself. Whether to decouple depends on your volumes and maturity.",
 context:"Orchestration is often discussed without defining its boundary, yet that boundary decides how stable a platform is. The orchestrator is the conductor: it sets when, how and in which order tasks run.",
 problem:"Two paradigms meet in practice. In the all-in-one model (for example Kestra on a VM), the orchestrator both triggers and executes. In the decoupled model (Airflow with Dataproc or Kubernetes), it delegates heavy compute to a distributed engine. Each has its own failure mode.",
 approach:["All-in-one suits agile projects and moderate volumes with quick setup. Risk: resource contention. If one Python script saturates the VM's RAM, the whole orchestrator goes down.","Decoupled suits demanding industrial environments and complex PySpark pipelines: near-unlimited scaling, failure isolation and fine-grained governance. Cost: more operational complexity (ephemeral infrastructure) and scattered logs.","Choose by maturity: Kestra / Prefect for speed and centralisation; Airflow + Dataproc / Snowflake for robustness and distributed compute."],
 principles:[["Keep the scheduler alive","Heavy jobs should not be able to take down the component that schedules everything else."],["Isolation has a price","Decoupling buys resilience and scale, and costs operational complexity."],["Fit the tool to the stage","The right architecture depends on volumes, team size and maturity, not on fashion."]]},
zh:{title:"数据编排：把「大脑」和「手臂」分开",
 tldr:"编排器应该决定任务何时、按什么顺序运行，而不总是亲自干重活。是否解耦，取决于数据量和团队成熟度。",
 context:"人们常谈编排，却很少定义它的边界，而这条边界决定了平台的稳定性。编排器是指挥：它决定任务何时、如何、按什么顺序执行。",
 problem:"实践中有两种范式。一体化模式（比如在虚拟机上跑 Kestra）里，编排器既触发也执行。解耦模式（Airflow 配 Dataproc 或 Kubernetes）里，它把重计算交给分布式引擎。两者各有自己的失败方式。",
 approach:["一体化适合敏捷项目、中等数据量、快速搭建。风险是资源争用：一个 Python 脚本占满虚拟机内存，整个编排器就会宕掉。","解耦适合要求严苛的工业级环境和复杂的 PySpark 管道：近乎无限的扩展、故障隔离、精细治理。代价是运维更复杂（临时基础设施），日志也更分散。","按成熟度选择：Kestra / Prefect 追求速度和集中；Airflow + Dataproc / Snowflake 追求稳健和分布式算力。"],
 principles:[["保证调度器活着","重任务不应该有能力拖垮负责调度一切的组件。"],["隔离是有代价的","解耦换来韧性和扩展性，付出的是运维复杂度。"],["工具要匹配阶段","合适的架构取决于数据量、团队规模和成熟度，而不是潮流。"]]},
fr:{title:"Orchestration : séparer le cerveau des bras",
 tldr:"Un orchestrateur doit décider quand et dans quel ordre les tâches tournent, pas toujours exécuter lui-même le calcul lourd. Découpler ou non dépend des volumes et de la maturité.",
 context:"On parle souvent d'orchestration sans en définir la frontière, alors que c'est là que se joue la stabilité d'une plateforme. L'orchestrateur est le chef d'orchestre : il définit le quand, le comment et l'ordre des tâches.",
 problem:"Deux paradigmes coexistent. Dans le modèle tout-en-un (par exemple Kestra sur VM), l'orchestrateur déclenche et exécute. Dans le modèle découplé (Airflow avec Dataproc ou Kubernetes), il délègue le calcul lourd à un moteur distribué. Chacun a son mode de défaillance.",
 approach:["Tout-en-un : idéal pour des projets agiles, des volumes modérés et une mise en place rapide. Risque : la contention de ressources. Si un script Python sature la RAM de la VM, tout l'orchestrateur tombe.","Découplé : pour des environnements industriels exigeants et des pipelines PySpark complexes. Scalabilité, isolation des pannes, gouvernance fine. Coût : complexité opérationnelle (infra éphémère) et logs dispersés.","Choisir selon la maturité : Kestra / Prefect pour la vélocité et la centralisation ; Airflow + Dataproc / Snowflake pour la robustesse et le calcul distribué."],
 principles:[["Garder l'ordonnanceur en vie","Un job lourd ne doit pas pouvoir faire tomber le composant qui planifie tout le reste."],["L'isolation a un prix","Découpler apporte résilience et scalabilité, au prix de la complexité opérationnelle."],["Adapter l'outil au stade","La bonne architecture dépend des volumes, de l'équipe et de la maturité, pas de la mode."]]}},

/* J. Targets phase 1 (04-23) */
"7452959586988412928":{domain:"platform",also:["modeling"],series:"targets",stack:["dbt seed","BigQuery snapshots","Airflow","SharePoint / Excel"],concepts:["targets","versioning","snapshot"],
en:{title:"Actuals vs targets, phase 1: ingest the human chaos",
 tldr:"Actuals live in clean systems; targets live in spreadsheets that change silently. Version and snapshot the targets so you can prove what the goal was at any date.",
 context:"Comparing results with objectives looks like the basics of the job, yet it is one of the most frequent scenarios and one of the hardest to stabilise in production.",
 problem:"It confronts two worlds that don't talk to each other. Actuals are clean, structured and stored in the CRM. Targets are born in Excel or SharePoint and get changed quietly on a Friday evening without telling anyone, so dashboard numbers shift “mysteriously” from one month to the next.",
 approach:["Static targets: version the CSV files directly in Git with dbt seed.","Living targets (SharePoint, spreadsheets): load them through a managed sync flow and add data quality checks that detect a collapsed file structure before loading.","Time travel: automate a regular snapshot of the target table (for example a monthly BigQuery table snapshot) to prove that at date T the objective was X, even if the source file has since been overwritten."],
 principles:[["Treat human-made data with suspicion","Manually edited files need structure checks before they enter the pipeline."],["Version anything that can change silently","History is what makes an audit answerable."],["Snapshots turn disputes into lookups","“What was the target then?” should be a query, not a debate."]]},
zh:{title:"实际 vs 目标（第一阶段）：驯服人为制造的混乱",
 tldr:"实际数据在规范的系统里，目标却在悄悄被改动的表格里。给目标做版本和快照，才能证明任一时点的目标到底是多少。",
 context:"把结果和目标做比较，看起来是本行的基本功，却是最常见、也最难在生产环境稳定下来的场景之一。",
 problem:"它让两个互不相通的世界正面相遇。实际数据干净、结构化，放在 CRM 里。目标诞生于 Excel 或 SharePoint，常在某个周五晚上被人悄悄改掉，没人通知，于是看板上的数字每个月都「神秘地」变化。",
 approach:["静态目标：用 dbt seed 把 CSV 文件直接纳入 Git 版本管理。","动态目标（SharePoint、表格）：通过托管的同步流程加载，并在加载前用数据质量检查发现文件结构是否崩坏。","时间回溯：定期自动为目标表做快照（例如每月一次 BigQuery 表快照），即使源文件后来被覆盖，也能证明在 T 时刻目标是 X。"],
 principles:[["对人工数据保持怀疑","手工编辑的文件进入管道前，必须做结构检查。"],["会被悄悄修改的东西都要版本化","有了历史，审计问题才有答案。"],["快照把争论变成查询","「当时的目标是多少？」应该是一条查询，而不是一场争论。"]]},
fr:{title:"Réel vs objectifs, phase 1 : dompter le chaos humain",
 tldr:"Le réalisé vit dans des systèmes propres ; les objectifs dans des tableurs modifiés en douce. Versionner et snapshotter les objectifs pour prouver ce qu'était la cible à toute date.",
 context:"Comparer ses réalisations à ses objectifs semble être la base du métier. C'est pourtant l'un des scénarios les plus fréquents et l'un des plus difficiles à stabiliser en production.",
 problem:"On confronte deux mondes qui ne se parlent pas. Les Actuals sont propres, structurés, nichés dans le CRM. Les Targets naissent dans un Excel ou un SharePoint, modifiés en douce un vendredi soir sans prévenir personne : les chiffres changent « mystérieusement » d'un mois à l'autre.",
 approach:["Objectifs statiques : versionner les CSV directement dans Git avec dbt seed.","Objectifs vivants (SharePoint, tableurs) : les charger via un flux de synchronisation géré, avec des contrôles qualité qui détectent l'effondrement d'une structure Excel avant chargement.","Time travel : automatiser un snapshot régulier de la table d'objectifs (par exemple un snapshot BigQuery mensuel) pour prouver qu'à l'instant T l'objectif était X, même si le fichier source a été écrasé depuis."],
 principles:[["Se méfier de la donnée saisie à la main","Les fichiers édités manuellement doivent être contrôlés avant d'entrer dans le pipeline."],["Versionner tout ce qui peut changer en silence","L'historique rend un audit possible."],["Le snapshot transforme un débat en requête","« Quel était l'objectif à l'époque ? » doit se résoudre par une requête."]]}},

/* K. Environments & access (04-17) */
"7450785147924312064":{domain:"platform",also:[],stack:["Cloud IAM","Dev / prod environments","Dashboards"],concepts:["envs","access","doc"],
en:{title:"Environments and access in large organisations: be explicit, not perfect",
 tldr:"Clean dev / prod separation is the textbook rule, but fine-grained, siloed access can make it impossible. Acknowledge the constraint and write the choice down.",
 context:"In theory the good practice is clear: separate dev and prod properly, with distinct access, to guarantee data quality and security.",
 problem:"In large accounts, governance is heavily siloed and access is very granular. On raw data, only production access was available. The code could be identical and orchestration well defined, but rights did not allow the same data scope in each environment. A related question was which environment a dashboard should be published from: where is the data really accessible, who can see what, and which source of truth should be exposed?",
 approach:["Accept that a perfect environment abstraction was not achievable under the access model.","Make the choices explicit: which environment reads which data, and why.","Reflect those choices in configuration and documentation so the next person understands them."],
 principles:[["Governance lives in access, not only in code","Who can read what shapes the architecture as much as the model does."],["Explicit beats elegant","A documented compromise causes fewer misunderstandings than an idealised design that silently differs from reality."],["Choose the publishing environment deliberately","Where a dashboard lives decides which truth its viewers see."]]},
zh:{title:"大型企业里的环境与权限：要明确，而不是完美",
 tldr:"开发 / 生产干净分离是教科书规则，但极细且分散的权限可能让它无法实现。承认约束，并把选择写下来。",
 context:"理论上，最佳实践很清楚：把开发和生产环境干净地分开，权限各自独立，以保证数据质量和安全。",
 problem:"在大型客户中，治理高度分散，权限粒度极细。在原始数据层面，只有生产环境的访问权限。代码可以完全一致、编排定义得很好，但权限不允许在不同环境中复现相同的数据范围。相关的另一个问题是：看板应该发布在哪个环境？数据实际能在哪里访问，谁能看到什么，应该暴露哪个事实来源？",
 approach:["接受在现有权限模型下，完美的环境抽象无法实现。","把选择讲清楚：哪个环境读取哪些数据，以及原因。","把这些选择体现在配置和文档里，让下一个人能理解。"],
 principles:[["治理体现在权限上，不只在代码里","谁能读什么，和数据模型一样塑造着架构。"],["明确胜过优雅","有文档的折中方案，比一个和现实悄悄不一致的理想设计误会更少。"],["有意识地选择发布环境","看板放在哪里，决定了看的人看到的是哪个「真相」。"]]},
fr:{title:"Environnements et accès dans les grands comptes : être explicite plutôt que parfait",
 tldr:"Séparer proprement dev et prod est la règle, mais des accès très fins et silotés peuvent la rendre impossible. Reconnaître la contrainte et documenter le choix.",
 context:"En théorie, les bonnes pratiques sont claires : séparer proprement les environnements dev et prod, avec des accès distincts, pour garantir qualité et sécurité.",
 problem:"Dans les grands comptes, la gouvernance est très silotée et la granularité des accès très fine. Sur les données brutes, seul l'accès production était disponible. Le code pouvait être identique et l'orchestration bien définie, mais les droits ne permettaient pas le même périmètre de données entre environnements. Autre question liée : dans quel environnement publier un dashboard ? Où la donnée est-elle réellement accessible, qui voit quoi, quelle source de vérité exposer ?",
 approach:["Accepter qu'une abstraction parfaite des environnements n'était pas atteignable avec ce modèle d'accès.","Rendre les choix explicites : quel environnement lit quelles données, et pourquoi.","Les refléter clairement dans la configuration et la documentation pour l'équipe suivante."],
 principles:[["La gouvernance se joue aussi dans les accès","Qui peut lire quoi façonne l'architecture autant que le modèle."],["Explicite vaut mieux qu'élégant","Un compromis documenté crée moins de malentendus qu'un design idéal qui diverge en silence."],["Choisir l'environnement de publication à dessein","L'endroit où vit un dashboard décide de la vérité que voient ses lecteurs."]]}},

/* L. Uber part 3 (04-14) */
"7449697987615920128":{domain:"semantic",also:["business"],series:"uber",stack:["Looker Studio","BigQuery"],concepts:["metricDef","doc","xfunc"],
en:{title:"Uber pipeline, part 3: the “Total Revenue” definition war",
 tldr:"A dashboard card called Total Revenue means gross for Finance, net for Operations and base fare for Marketing. Put the formula on the card and let users switch views.",
 context:"Last part of my review of a public GCP data engineering project built on the Uber / NYC TLC dataset. The Looker Studio dashboard follows a classic hierarchy: filters (vendor, rate code) powered by the star schema, headline KPIs (Total Revenue $1.5M, average trip distance) and a demand heatmap.",
 problem:"The hardest part is not the visual, it is the metric definition. Finance reads Total Revenue as gross (everything collected); Operations needs net (without tolls, taxes and surcharges) to measure performance; Marketing may ignore surcharges and focus on the base fare. Different mental formulas behind one card turn the dashboard into a source of confusion.",
 approach:["Embed definitions: an information tooltip on the card states the exact formula.","Add a switcher so each department can toggle between gross and net.","Add time intelligence (period-over-period trends) to move from reporting what happened towards anticipating what comes next."],
 principles:[["One label, one formula","If a KPI can be read several ways, the formula has to be visible where the number is."],["Design for each audience","Letting users pick the variant they need beats arguing over a single number."],["Engineering is a refinery","The job is to deliver unambiguous figures for decisions, not just to move bytes."]]},
zh:{title:"Uber 管道（第三部分）：「总收入」的定义之争",
 tldr:"同一张「总收入」卡片，财务看的是总额，运营要的是净额，市场关注基础车费。把公式放在卡片上，并允许用户切换视角。",
 context:"这是我对一个基于 Uber / 纽约 TLC 数据集的公开 GCP 数据工程项目的最后一部分复盘。Looker Studio 看板采用经典层次：由星型模型支撑的筛选器（供应商、费率代码）、核心 KPI（总收入 150 万美元、平均行程距离），以及需求热力图。",
 problem:"最难的不是可视化，而是指标定义。财务把总收入理解为总额（收到的全部）；运营需要净额（扣除过路费、税费和附加费）来衡量表现；市场可能忽略附加费，只看基础车费。一张卡片背后是不同的心算公式，看板就从对齐工具变成了困惑之源。",
 approach:["嵌入定义：在卡片上加信息提示，写明确切公式。","加一个切换器，让各部门在总额和净额之间切换。","加入时间智能（环比趋势），从「报告发生了什么」走向「预判接下来会怎样」。"],
 principles:[["一个名称，一个公式","如果一个 KPI 能被多种理解，公式就必须出现在数字旁边。"],["为每类受众设计","让用户选择自己需要的口径，胜过围绕一个数字争论。"],["数据工程是一座炼油厂","我们的工作是为决策交付无歧义的数字，而不只是搬运字节。"]]},
fr:{title:"Pipeline Uber, partie 3 : la guerre des définitions du « Total Revenue »",
 tldr:"Une carte « Total Revenue » signifie brut pour la Finance, net pour les Opérations, tarif de base pour le Marketing. Afficher la formule sur la carte et laisser l'utilisateur basculer.",
 context:"Dernière partie de ma revue d'un projet public de data engineering sur GCP basé sur le dataset Uber / NYC TLC. Le dashboard Looker Studio suit une hiérarchie classique : filtres (vendor, rate code) portés par le schéma en étoile, KPI clés (Total Revenue 1,5 M$, distance moyenne) et heatmap de la demande.",
 problem:"Le plus difficile n'est pas le visuel mais la définition. La Finance lit le Total Revenue en brut (tout l'encaissé) ; les Opérations ont besoin du net (hors péages, taxes, suppléments) ; le Marketing ignore parfois les suppléments pour regarder le tarif de base. Des formules mentales différentes derrière une même carte font du dashboard une source de confusion.",
 approach:["Intégrer les définitions : une info-bulle (i) sur la carte donne la formule exacte.","Ajouter un sélecteur pour basculer entre brut et net selon le département.","Ajouter de la Time Intelligence (tendances période sur période) pour passer du constat à l'anticipation."],
 principles:[["Un libellé, une formule","Si un KPI peut se lire de plusieurs façons, la formule doit être visible à côté du chiffre."],["Concevoir pour chaque public","Laisser choisir la variante utile vaut mieux que débattre d'un chiffre unique."],["L'ingénierie est une raffinerie","Livrer des chiffres sans ambiguïté pour décider, pas seulement déplacer des octets."]]}},

/* M. Uber part 2 (04-07) */
"7447161373740048384":{domain:"modeling",also:["semantic"],series:"uber",fig:"star",stack:["BigQuery","Looker","Mage AI"],concepts:["star","fanout","modular"],
en:{title:"Uber pipeline, part 2: why split a wide table into a star schema",
 tldr:"Separating metrics (fact) from descriptions and rules (dimensions) reduces redundancy, keeps the semantic layer simple, and mirrors how billing engines separate transactions from pricing rules.",
 context:"Part 2 of the review of a public Uber ETL project on GCP, focused on data modelling. The raw trip data arrives as one wide table.",
 problem:"Why bother decomposing it into fact and dimension tables instead of querying the wide table directly?",
 approach:["Isolate core metrics (fare, distance, tips) in a central fact table, linked to dimensions (datetime, location, rate code). Less redundancy, a better organised warehouse.","Use the star schema as the base for Looker: simpler joins, no fan-out, symmetric aggregates working as intended, leaner LookML, and fast dashboards because heavy logic is done upstream in BigQuery.","Note the transfer to finance: modelling rate codes (standard, JFK, negotiated) apart from trip metrics is the same pattern as interchange fees or multi-party splits in fintech, where separating transaction metrics from pricing rules gives consistency and auditability."],
 principles:[["Move complexity upstream","A solid model makes every downstream query simpler and faster."],["Separate facts from rules","Keeping metrics and pricing logic apart makes reconciliation possible."],["Model for the semantic layer","A clean star schema is what lets a BI layer stay small and correct."]]},
zh:{title:"Uber 管道（第二部分）：为什么要把宽表拆成星型模型",
 tldr:"把度量（事实表）和描述、规则（维度表）分开，能减少冗余、让语义层保持简洁，也正对应计费引擎把交易与定价规则分离的做法。",
 context:"对一个公开的 GCP 上 Uber ETL 项目的复盘第二部分，聚焦数据建模。原始行程数据是一张宽表。",
 problem:"为什么要费劲把它拆成事实表和维度表，而不是直接查询宽表？",
 approach:["把核心度量（车费、距离、小费）放进中心事实表，再关联维度（时间、地点、费率代码）。冗余更少，数仓更有条理。","以星型模型作为 Looker 的基础：关联更简单、没有扇出、对称聚合按预期工作、LookML 更精简；重逻辑在 BigQuery 上游完成，看板几秒就能加载。","迁移到金融场景：把费率代码（标准、JFK、协商价）与行程度量分开建模，和金融科技里的交换费、多方分账是同一模式——交易度量与定价规则分离，带来一致性与可审计性。"],
 principles:[["把复杂度移到上游","扎实的模型让下游每一条查询更简单、更快。"],["事实与规则分离","度量和定价逻辑分开，对账才有可能。"],["为语义层建模","干净的星型模型，才能让 BI 层保持小而正确。"]]},
fr:{title:"Pipeline Uber, partie 2 : pourquoi éclater une table large en schéma en étoile",
 tldr:"Séparer les métriques (fait) des descriptions et règles (dimensions) réduit la redondance, simplifie la couche sémantique et reproduit la logique des moteurs de facturation qui séparent transactions et règles tarifaires.",
 context:"Partie 2 de la revue d'un projet ETL Uber public sur GCP, centrée sur la modélisation. Les trajets bruts arrivent dans une seule table large.",
 problem:"Pourquoi se donner la peine de la décomposer en tables de faits et de dimensions plutôt que d'interroger directement la table large ?",
 approach:["Isoler les métriques clés (tarif, distance, pourboires) dans une table de faits centrale, reliée à des dimensions (date, lieu, rate code). Moins de redondance, un entrepôt mieux organisé.","S'appuyer sur l'étoile pour Looker : jointures simples, pas de fan-out, Symmetric Aggregates qui fonctionnent, LookML allégé, dashboards rapides car la logique lourde est faite en amont dans BigQuery.","Transposer à la finance : modéliser les rate codes (standard, JFK, négocié) à part des métriques de trajet, c'est le pattern des interchange fees ou des splits multi-parties en fintech, où séparer métriques et règles de prix garantit cohérence et auditabilité."],
 principles:[["Déplacer la complexité en amont","Un modèle solide rend chaque requête aval plus simple et plus rapide."],["Séparer les faits des règles","Isoler métriques et logique tarifaire rend la réconciliation possible."],["Modéliser pour la couche sémantique","Une étoile propre permet à la couche BI de rester légère et juste."]]}},

/* N. Uber part 1 (03-31) */
"7444624664456318976":{domain:"orchestration",also:["modeling"],series:"uber",fig:"uberflow",stack:["GCS","Mage AI","Compute Engine","BigQuery","Looker Studio"],concepts:["modular","orchestrator"],
en:{title:"Uber pipeline, part 1: from spaghetti scripts to modular blocks",
 tldr:"A public GCP project shows a clean pipeline flow (GCS → Mage → BigQuery → Looker Studio) and how block-level orchestration makes logic reusable and errors easy to isolate.",
 context:"Inspired by an internal workshop on script modularisation, I deconstructed a public Uber ETL project on GCP. It illustrates how to move from “spaghetti scripts” to a maintainable architecture.",
 problem:"Monolithic scripts mix ingestion, business logic and loading. When something fails, the whole script has to be read and rerun to find where.",
 approach:["Follow the flow: raw NYC taxi data lands in GCS (data lake, persistence and auditability); Mage AI on a GCP VM orchestrates; cleaned data loads into fact and dimension tables in BigQuery for Looker Studio.","Use Mage's block architecture: data loaders only ingest, transformers hold the business logic (decoupled and reusable), exporters push to BigQuery, and built-in tests validate schema and quality in each block.","Debug at block level in the interactive UI: immediate feedback per block isolates errors faster than a CLI run."],
 principles:[["One block, one responsibility","Separating load, transform and export makes each part testable and reusable."],["Test inside the pipeline","Schema and quality checks belong in each step, not only at the end."],["Size the infrastructure to the volume","This setup suits medium datasets; enterprise traffic needs more distributed compute."]]},
zh:{title:"Uber 管道（第一部分）：从「面条脚本」到模块化积木",
 tldr:"一个公开的 GCP 项目展示了清晰的管道流程（GCS → Mage → BigQuery → Looker Studio），以及按块编排如何让逻辑可复用、错误易定位。",
 context:"受一次关于脚本模块化的内部工作坊启发，我拆解了一个公开的 GCP 上的 Uber ETL 项目。它很好地展示了如何从「面条式脚本」走向可维护的架构。",
 problem:"单体脚本把采集、业务逻辑和加载混在一起。出了问题，只能把整段脚本读一遍、重跑一遍才能找到位置。",
 approach:["理清流程：纽约出租车原始数据落到 GCS（数据湖，用于留存和审计）；在 GCP 虚拟机上运行的 Mage AI 负责编排；清洗后的数据以事实表和维度表加载进 BigQuery，供 Looker Studio 分析。","采用 Mage 的块架构：加载块只负责采集，转换块承载业务逻辑（解耦、可复用），导出块写入 BigQuery，内置测试在每个块里校验结构和质量。","在交互式界面里按块调试：每个块即时反馈，比命令行更快定位错误。"],
 principles:[["一个块，一个职责","把加载、转换、导出分开，每部分都可测试、可复用。"],["在管道内部做测试","结构和质量检查应放在每一步，而不只是最后。"],["基础设施要匹配数据量","这种架构适合中等规模数据；企业级流量需要更分布式的计算。"]]},
fr:{title:"Pipeline Uber, partie 1 : des scripts spaghetti aux blocs modulaires",
 tldr:"Un projet GCP public montre un flux propre (GCS → Mage → BigQuery → Looker Studio) et comment une orchestration par blocs rend la logique réutilisable et les erreurs faciles à isoler.",
 context:"Inspiré par un atelier interne sur la modularisation des scripts, j'ai déconstruit un projet ETL Uber public sur GCP. Il illustre le passage de « scripts spaghetti » à une architecture maintenable.",
 problem:"Un script monolithique mélange ingestion, logique métier et chargement. En cas d'échec, il faut relire et relancer tout le script pour trouver où.",
 approach:["Suivre le flux : les données taxis NYC brutes arrivent dans GCS (Data Lake, persistance et auditabilité) ; Mage AI sur une VM GCP orchestre ; les données nettoyées sont chargées en tables de faits et dimensions dans BigQuery pour Looker Studio.","Utiliser l'architecture en blocs de Mage : les loaders ne font que l'ingestion, les transformers portent la logique métier (découplée, réutilisable), les exporters poussent vers BigQuery, et des tests intégrés valident schéma et qualité dans chaque bloc.","Déboguer bloc par bloc dans l'interface : le retour immédiat isole les erreurs plus vite qu'une exécution en CLI."],
 principles:[["Un bloc, une responsabilité","Séparer chargement, transformation et export rend chaque partie testable et réutilisable."],["Tester dans le pipeline","Les contrôles de schéma et de qualité ont leur place à chaque étape, pas seulement à la fin."],["Dimensionner l'infra selon le volume","Ce montage convient à des volumes moyens ; un trafic d'entreprise demande un calcul plus distribué."]]}}

"7441762454910595072":{domain:"business",also:["semantic"],series:"targets",article:"https://medium.com/@gabrielluz1564/engineering-ambition-a-practical-guide-to-robust-target-analytics-4f610920bdc2",stack:["dbt","BigQuery","Airflow","Looker","Hightouch"],concepts:["targets","fanout","joins","versioning"],
en:{title:"Actuals vs targets end to end: a five-phase framework",
 tldr:"“Just join actuals and targets” hides five separate problems: ingestion, shape and grain, join logic, visualisation, and acting on the gap. Each phase has its own trap.",
 context:"Comparing real performance with strategic targets is one of the most common requests a data team receives. On the surface it is a subtraction. In production it is where double counting flourishes and trust in data breaks.",
 problem:"The two sides differ in every way: actuals come from reliable systems, targets from spreadsheets; the shapes differ (wide budgets vs long transactions); the grains differ (daily vs monthly); and the business question behind the dashboard is rarely made explicit.",
 approach:["Phase 1, ingest: partition actuals by time; version static targets with dbt seed; sync living targets with checks on file structure; snapshot the target table monthly for time travel.","Phase 2, integrate: UNPIVOT monthly columns into rows; handle the daily-vs-monthly fan-out with ROW_NUMBER() in SQL (fragile) or, more robustly, symmetric aggregates in Looker.","Phase 3, align: LEFT JOIN for an active-execution view, FULL OUTER JOIN for a strategic view that exposes planned-but-missing items.","Phase 4, visualise: colour-coded scorecards (e.g. green above 90%, red below 80%), actuals against a linear target line, and drill-down to find the bottleneck.","Phase 5, act: conditional alerts (e.g. notify the manager if the gap exceeds 20% by the 15th) and reverse ETL (e.g. Hightouch) to push the target gap back into the CRM."],
 principles:[["A “simple” request can hide a pipeline","Break it into phases and look for the trap in each one."],["Trust is the real deliverable","Versioned targets and correct grain matter more than the chart."],["Close the loop","An insight that reaches the tool people work in gets acted on."]]},
zh:{title:"实际 vs 目标全流程：五阶段框架",
 tldr:"「把实际和目标关联一下」背后藏着五个独立问题：采集、形状与粒度、关联逻辑、可视化、以及如何对差距采取行动。每个阶段都有自己的陷阱。",
 context:"把实际表现和战略目标做对比，是数据团队最常收到的需求之一。表面上只是一个减法，在生产环境里却是重复计算泛滥、数据信任破裂的地方。",
 problem:"两边处处不同：实际数据来自可靠系统，目标来自表格；形状不同（宽格式预算 vs 长格式交易）；粒度不同（按天 vs 按月）；而看板背后的业务问题很少被讲明白。",
 approach:["第一阶段，采集：实际数据按时间分区；静态目标用 dbt seed 版本化；动态目标同步时检查文件结构；每月给目标表做快照以便回溯。","第二阶段，整合：用 UNPIVOT 把月份列转成行；处理日 vs 月的扇出，可在 SQL 里用 ROW_NUMBER()（脆弱），更稳健的是 Looker 的对称聚合。","第三阶段，对齐：执行类视图用 LEFT JOIN，战略类视图用 FULL OUTER JOIN，暴露「计划了却缺失」的项目。","第四阶段，可视化：彩色记分卡（如 90% 以上绿、80% 以下红），实际值对比线性目标线，并支持下钻找瓶颈。","第五阶段，行动：条件告警（如到 15 号差距超过 20% 就通知经理），以及反向 ETL（如 Hightouch）把目标差距推回 CRM。"],
 principles:[["「简单」需求背后可能是一整条管道","拆成阶段，逐一找出每个阶段的陷阱。"],["真正的交付物是信任","目标版本化和粒度正确，比图表本身更重要。"],["形成闭环","能出现在人们日常工具里的洞察，才会被执行。"]]},
fr:{title:"Réel vs objectifs de bout en bout : un cadre en cinq phases",
 tldr:"« Il suffit de joindre réel et objectifs » cache cinq problèmes distincts : ingestion, forme et grain, logique de jointure, visualisation, et action sur l'écart. Chaque phase a son piège.",
 context:"Comparer la performance réelle aux objectifs stratégiques est l'une des demandes les plus fréquentes. En surface, une soustraction. En production, c'est là que prospèrent les doubles comptages et que la confiance se casse.",
 problem:"Les deux côtés diffèrent en tout : le réalisé vient de systèmes fiables, les objectifs de tableurs ; les formes diffèrent (budget « wide » vs transactions « long ») ; les grains aussi (jour vs mois) ; et la question métier derrière le dashboard est rarement explicite.",
 approach:["Phase 1, ingérer : partitionner le réalisé par date ; versionner les objectifs statiques avec dbt seed ; synchroniser les objectifs vivants avec contrôle de structure ; snapshotter la table d'objectifs chaque mois pour le time travel.","Phase 2, intégrer : UNPIVOT des colonnes mensuelles ; gérer le fan-out jour / mois avec ROW_NUMBER() en SQL (fragile) ou, plus robuste, les Symmetric Aggregates de Looker.","Phase 3, aligner : LEFT JOIN pour une vue d'exécution, FULL OUTER JOIN pour une vue stratégique qui expose ce qui était prévu mais absent.","Phase 4, visualiser : scorecards colorées (ex. vert au-dessus de 90 %, rouge sous 80 %), réel face à une ligne d'objectif linéaire, et drill-down pour trouver le goulot.","Phase 5, agir : alertes conditionnelles (ex. prévenir le manager si l'écart dépasse 20 % au 15 du mois) et reverse ETL (ex. Hightouch) pour renvoyer l'écart dans le CRM."],
 principles:[["Une demande « simple » peut cacher un pipeline","La découper en phases et chercher le piège de chacune."],["Le vrai livrable, c'est la confiance","Des objectifs versionnés et un grain juste comptent plus que le graphique."],["Boucler la boucle","Une information qui arrive dans l'outil de travail est suivie d'action."]]}},

/* P. Looker vs Looker Studio (03-12) */
"7437741724082434048":{domain:"semantic",also:[],series:"looker",article:"https://medium.com/@gabrielluz1564/the-data-practitioners-odyssey-looker-and-looker-studio-more-than-just-twins-e89ccb22fe92",stack:["Looker","Looker Studio","GA4","Google Ads","Google Sheets"],concepts:["toolchoice","ssot","access","selfservice"],
en:{title:"Looker or Looker Studio? Two tools, not two editions",
 tldr:"Looker is the architect: logic as code, Git, roles and governed drill-downs. Looker Studio is the painter: fast, visual, marketing-friendly, but prone to data islands. Pick by the job, not the name.",
 context:"“Which Looker should we use?” comes up often. Many people assume Looker Studio is a lite version of Looker. They share a name, but they were built for different needs: Looker is a native enterprise data platform; Looker Studio (formerly Google Data Studio) serves rapid, ad-hoc visualisation.",
 problem:"Choosing the wrong one has a cost. Using Studio as an enterprise foundation leads to logic hard-coded in individual reports, unclear ownership and inconsistent numbers. Using Looker for quick marketing reporting adds modelling effort where speed was the need.",
 approach:["Looker: business logic in LookML with native Git, a central semantic layer as single source of truth, role-based access (viewer, editor, owner…) and drill-downs that stay governed at every level.","Looker Studio: native connectors to GA4, Google Ads and Sheets, intuitive drag-and-drop styling, quick period comparisons (N-1) and near-zero entry barrier.","Know Studio's limits: open access makes it hard to track who builds what; logic scattered across reports creates data islands; edits can fail to save or show different versions to colleagues."],
 principles:[["Foundation vs instant value","Build enterprise assets on governed tooling; use agile tools for fast, local answers."],["Governance has to live somewhere","Without a central layer, each report carries its own version of the rules."],["Match the tool to the user","Marketers needing speed and analysts needing a single truth have different requirements."]]},
zh:{title:"Looker 还是 Looker Studio？两个工具，而不是两个版本",
 tldr:"Looker 是「建筑师」：逻辑即代码、Git、角色权限、受治理的下钻。Looker Studio 是「画家」：快速、直观、对市场团队友好，但容易形成数据孤岛。按任务选，而不是按名字选。",
 context:"「我们该用哪个 Looker？」这个问题常被问到。很多人以为 Looker Studio 是 Looker 的精简版。它们名字相同，却为不同需求而生：Looker 是原生的企业级数据平台；Looker Studio（前身 Google Data Studio）服务于快速、临时的可视化。",
 problem:"选错是有代价的。把 Studio 当企业基础，逻辑会硬编码在各个报表里，归属不清，数字不一致。用 Looker 做快速的营销报表，则在需要速度的地方增加了建模成本。",
 approach:["Looker：业务逻辑写在 LookML 里，原生支持 Git；中心语义层作为唯一事实来源；基于角色的权限（查看者、编辑者、所有者等）；每一层下钻都受治理。","Looker Studio：原生连接 GA4、Google Ads 和 Sheets，拖拽式样式直观，同比 / 环比（N-1）对比切换快，几乎零门槛。","了解 Studio 的局限：开放访问让人难以追踪谁在建什么；逻辑分散在各报表里形成数据孤岛；编辑有时保存失败，或同事看到不同版本。"],
 principles:[["打地基 vs 即时价值","企业级资产建在受治理的工具上；快速、局部的问题用敏捷工具。"],["治理总要有个落脚点","没有中心层，每张报表都带着自己的一套规则。"],["工具要匹配用户","追求速度的市场人员和需要统一口径的分析师，需求不同。"]]},
fr:{title:"Looker ou Looker Studio ? Deux outils, pas deux éditions",
 tldr:"Looker est l'architecte : logique en code, Git, rôles, drill-down gouverné. Looker Studio est le peintre : rapide, visuel, taillé pour le marketing, mais propice aux îlots de données. Choisir selon le besoin, pas le nom.",
 context:"« Quel Looker faut-il utiliser ? » revient souvent. Beaucoup pensent que Looker Studio est une version allégée de Looker. Ils partagent un nom mais répondent à des besoins différents : Looker est une plateforme data d'entreprise native ; Looker Studio (ex-Google Data Studio) sert la visualisation rapide et ad hoc.",
 problem:"Se tromper coûte cher. Utiliser Studio comme fondation d'entreprise disperse la logique dans chaque rapport, brouille la responsabilité et crée des chiffres incohérents. Utiliser Looker pour un reporting marketing rapide ajoute de la modélisation là où il fallait de la vitesse.",
 approach:["Looker : logique métier en LookML avec Git natif, couche sémantique centrale comme source unique de vérité, accès par rôles (viewer, editor, owner…) et drill-down gouverné à chaque niveau.","Looker Studio : connecteurs natifs GA4, Google Ads et Sheets, mise en forme intuitive par glisser-déposer, comparaisons N-1 rapides et barrière d'entrée quasi nulle.","Connaître les limites de Studio : l'accès ouvert rend difficile le suivi de qui construit quoi ; la logique éparpillée crée des îlots de données ; des modifications peuvent ne pas s'enregistrer ou apparaître différemment selon les collègues."],
 principles:[["Fondation vs valeur immédiate","Bâtir les actifs d'entreprise sur un outil gouverné ; garder l'agile pour les réponses rapides et locales."],["La gouvernance doit vivre quelque part","Sans couche centrale, chaque rapport porte sa version des règles."],["Adapter l'outil à l'utilisateur","Le marketeur pressé et l'analyste en quête d'une vérité unique n'ont pas les mêmes besoins."]]}},

/* Q. Recette (03-02) */
"7434149629199282177":{domain:"business",also:[],article:"https://medium.com/@gabrielluz1564/why-your-numbers-dont-match-the-client-s-48cf0fe7d0fe",stack:["SQL","Shopify / CRM / ERP","BI"],concepts:["recon","metricDef","fanout","filter"],
en:{title:"Why your numbers don't match the client's: a reconciliation checklist",
 tldr:"“Your total is off” usually comes from a different date, a different definition, a hidden filter or a sync gap, not from bad SQL. Check them in order, and trace a few real orders.",
 context:"Each first quarter is audit season: companies review last year's performance. You deliver a dashboard with clean SQL and sound logic, then the client compares it with an internal report and says the total is off. In France this reconciliation phase is called la recette, and it is rarely taught.",
 problem:"Reconciliation is detective work: messy exports, sync delays and inconsistent business logic. Without a method, teams lose days arguing about whose number is right.",
 approach:["Agree on the reference date: order, invoice, shipping or accounting date. January sales by invoice and by shipping will never match.","Build a KPI dictionary: net vs gross, VAT, promo codes at line or order level, bundles as one unit or several. For platforms like Shopify, read the developer docs (e.g. total_sales includes returns and shipping, gross_sales does not).","Exclude inter-company flows: internal transfers between warehouses or subsidiaries often get order numbers but are not sales.","Check hidden filters and sync: make sure the starting population matches; when it still differs, compare a few mismatched IDs between your warehouse and the client's app.","Trace 3–5 orders by hand against the source app, including messy cases (partial returns, several discounts, split shipments), on a frozen period such as the previous full month.","Before touching SQL, snapshot the correct numbers; a changed JOIN type or an extra GROUP BY column can fan out or drop rows."],
 principles:[["20% SQL, 80% communication","Most gaps come from different assumptions, not from code."],["Reconciliation drives governance","A “wrong” number often points to missing master data or documentation at the source."],["Trust is the final KPI","Bridging technical reality and business perception is the actual deliverable."]]},
zh:{title:"为什么你的数字和客户的对不上：一份核对清单",
 tldr:"「你的总数不对」通常源于不同的日期、不同的定义、隐藏的筛选或同步延迟，而不是 SQL 写错了。按顺序检查，并手工追踪几笔真实订单。",
 context:"每年第一季度都是「审计季」：企业复盘上一年的业绩。你交付了 SQL 干净、逻辑严谨的看板，客户拿它和内部报表一比，说总数不对。在法国，这个核对阶段叫 la recette，学校里很少教。",
 problem:"核对是侦探工作：混乱的导出、同步延迟、不一致的业务逻辑。没有方法，团队会花好几天争论谁的数字是对的。",
 approach:["先统一参考日期：下单日、开票日、发货日还是记账日。按开票和按发货统计的一月销售永远对不上。","建立 KPI 词典：净额还是总额、是否含增值税、折扣按行还是按单扣、套装算一件还是多件。像 Shopify 这样的平台，要读开发者文档（例如 total_sales 含退货和运费，gross_sales 不含）。","排除内部往来：仓库或子公司之间的内部调拨常常也有订单号，但不是销售。","检查隐藏筛选和同步：确认起始数据范围一致；仍有差异时，挑几笔不一致的 ID，比较你的数仓和客户系统里的状态。","手工追踪 3–5 笔订单，对照源系统界面，包括复杂情况（部分退货、多重折扣、分批发货），并使用冻结的时间窗口（如上一个完整月）。","改 SQL 之前先给正确数字做快照；JOIN 类型的改动或 GROUP BY 多一列，都可能造成扇出或丢行。"],
 principles:[["20% 靠 SQL，80% 靠沟通","大多数差异来自不同的假设，而不是代码。"],["核对推动治理","「错误」的数字往往指向源头缺失的主数据或文档。"],["信任是最终的 KPI","弥合技术现实与业务感知，才是真正的交付物。"]]},
fr:{title:"Pourquoi vos chiffres ne collent pas à ceux du client : une checklist de recette",
 tldr:"« Votre total est faux » vient en général d'une autre date, d'une autre définition, d'un filtre caché ou d'un décalage de synchronisation, pas d'un mauvais SQL. Vérifier dans l'ordre, et tracer quelques commandes réelles.",
 context:"Chaque premier trimestre, c'est la saison des audits : les entreprises revoient l'année écoulée. Vous livrez un dashboard au SQL propre, le client le compare à son rapport interne et dit que le total est faux. La recette, rarement enseignée à l'école.",
 problem:"La recette est un travail de détective : exports désordonnés, retards de synchronisation, logique métier incohérente. Sans méthode, on perd des jours à débattre de qui a le bon chiffre.",
 approach:["S'accorder sur la date de référence : commande, facture, expédition ou écriture comptable. Les ventes de janvier par facture et par expédition ne coïncideront jamais.","Construire un dictionnaire de KPI : net ou brut, TVA, remises à la ligne ou à la commande, packs comptés comme une ou plusieurs unités. Sur Shopify, lire la doc développeur (ex. total_sales inclut retours et frais de port, gross_sales non).","Exclure les flux intra-groupe : les transferts entre entrepôts ou filiales ont souvent un numéro de commande sans être des ventes.","Vérifier filtres cachés et synchronisation : s'assurer que la population de départ est la même ; en cas d'écart, comparer quelques IDs entre l'entrepôt de données et l'application du client.","Tracer 3 à 5 commandes à la main dans l'application source, y compris des cas complexes (retours partiels, remises multiples, expéditions fractionnées), sur une période figée comme le dernier mois complet.","Avant de toucher au SQL, figer les bons chiffres ; un changement de JOIN ou une colonne de plus dans le GROUP BY peut dupliquer ou perdre des lignes."],
 principles:[["20 % de SQL, 80 % de communication","La plupart des écarts viennent d'hypothèses différentes, pas du code."],["La recette nourrit la gouvernance","Un chiffre « faux » révèle souvent des données de référence ou une documentation manquantes à la source."],["La confiance est le KPI final","Rapprocher réalité technique et perception métier, c'est le vrai livrable."]]}},

/* R. SQL chaos to Data Zen (02-18) */
"7429985750319915008":{domain:"semantic",also:[],series:"looker",article:"https://medium.com/@gabrielluz1564/from-sql-chaos-to-data-zen-how-looker-restored-my-sanity-as-a-developer-647a8957ee2c",stack:["Looker","LookML","Git"],concepts:["declarative","grain","ssot","drill","git"],
en:{title:"From SQL chaos to Data Zen: six developer pains a semantic layer removes",
 tldr:"Declaring what the data is, instead of scripting how to transform it, removed six recurring pains: grain changes, cryptic column names, duplicated metrics, slow debugging, risky edits and rigid filters.",
 context:"After writing about Looker's user-facing features, I looked at it from the developer's side: the pains of traditional dashboard development, and what changed once I worked on a semantic layer.",
 problem:"Traditional SQL workflows create “perpetual firefighting”: one extra column can break downstream tables or change the grain; cryptic technical names need constant re-mapping; the same logic is rewritten for every request; a challenged number means reverse-engineering several SQL steps; collaborative edits can overwrite work; and making one KPI ignore a filter takes SQL hacks.",
 approach:["Grain: the semantic layer acts as one virtual big table; Looker generates SQL per question, so adding a field never means rewriting a GROUP BY.","Language: label technical columns once with business-friendly names to build a shared dictionary.","Single source of truth: define a metric once in LookML; a change propagates to every dashboard.","Debugging: drill down to the raw rows behind a value and see which filters were active.","Safety: native Git integration to branch, review and revert.","Filters: choose which tiles and measures listen to which filter, so a static total can sit next to a filtered trend."],
 principles:[["Declare, don't script","Describing what data is scales better than procedural transformation code."],["Shared vocabulary prevents errors","Most misunderstandings between developers and business users are naming problems."],["Make the engine generate the SQL","Hand-written aggregation per request is where grain and fan-out bugs come from."]]},
zh:{title:"从 SQL 混乱到「数据禅」：语义层帮开发者消除的六个痛点",
 tldr:"从编写「如何转换」转向声明「数据是什么」，消除了六个反复出现的痛点：粒度变化、晦涩的字段名、重复的指标、缓慢的排查、高风险的编辑，以及僵硬的筛选器。",
 context:"写完 Looker 面向用户的功能后，我换到开发者视角：传统看板开发的痛点有哪些，转到语义层后又改变了什么。",
 problem:"传统 SQL 工作流让人「永远在救火」：多加一列可能破坏下游表或改变粒度；晦涩的技术字段名需要反复映射；同样的逻辑每个需求重写一遍；一个数字被质疑，就要逆向推几层 SQL；多人协作的编辑可能覆盖彼此的成果；让某个 KPI 不受筛选影响，需要 SQL 小技巧。",
 approach:["粒度：语义层像一张虚拟的大宽表；Looker 按问题动态生成 SQL，加字段永远不需要改 GROUP BY。","语言：给技术字段一次性标上业务名称，形成共享词典。","唯一事实来源：指标在 LookML 中只定义一次，改动会传播到所有看板。","排查：下钻到数值背后的原始行，并看到当时生效的筛选条件。","安全：原生 Git 集成，可以分支、评审、回滚。","筛选：指定哪些图块和度量响应哪个筛选器，让静态总计和筛选后的趋势并存。"],
 principles:[["声明，而不是编写过程","描述数据是什么，比过程式转换代码更易扩展。"],["共享词汇能防止错误","开发与业务之间的误解，大多是命名问题。"],["让引擎生成 SQL","每个需求手写聚合，正是粒度和扇出 bug 的来源。"]]},
fr:{title:"Du chaos SQL au « Data Zen » : six douleurs de développeur qu'une couche sémantique supprime",
 tldr:"Déclarer ce qu'est la donnée plutôt que scripter comment la transformer a supprimé six douleurs récurrentes : changements de grain, noms de colonnes obscurs, métriques dupliquées, débogage lent, modifications risquées et filtres rigides.",
 context:"Après les fonctionnalités côté utilisateur, j'ai regardé Looker du point de vue du développeur : les douleurs du développement de dashboards traditionnel, et ce qui a changé avec une couche sémantique.",
 problem:"Le flux SQL traditionnel crée un « pompier permanent » : une colonne de plus peut casser des tables aval ou changer le grain ; les noms techniques obscurs demandent un mapping constant ; la même logique est réécrite à chaque demande ; un chiffre contesté oblige à remonter plusieurs étapes SQL ; les éditions collaboratives peuvent écraser le travail ; et faire ignorer un filtre à un KPI demande des astuces SQL.",
 approach:["Grain : la couche sémantique agit comme une grande table virtuelle ; Looker génère le SQL par question, ajouter un champ ne demande jamais de réécrire un GROUP BY.","Langage : nommer une fois les colonnes techniques en termes métier pour créer un dictionnaire partagé.","Source unique de vérité : une métrique définie une fois en LookML se propage à tous les dashboards.","Débogage : drill-down vers les lignes brutes derrière une valeur, avec les filtres actifs visibles.","Sécurité : intégration Git native pour brancher, relire et revenir en arrière.","Filtres : choisir quelles tuiles et mesures écoutent quel filtre, pour qu'un total fixe côtoie une tendance filtrée."],
 principles:[["Déclarer plutôt que scripter","Décrire ce qu'est la donnée passe mieux à l'échelle que du code procédural."],["Un vocabulaire partagé évite les erreurs","La plupart des malentendus entre dev et métier sont des problèmes de nommage."],["Laisser le moteur générer le SQL","L'agrégation écrite à la main à chaque demande est la source des bugs de grain et de fan-out."]]}},

/* S. 3 Looker features (02-09) */
"7426535365651361794":{domain:"semantic",also:[],series:"looker",article:"https://medium.com/@gabrielluz1564/beyond-the-surface-3-looker-features-that-solve-your-daily-visualization-headaches-cb894c8458eb",stack:["Looker"],concepts:["drill","selfservice","ssot"],
en:{title:"Three Looker features for everyday dashboard pain",
 tldr:"Drill-through answers “how was this calculated?”, per-tile filter control keeps benchmarks stable, and Explore lets users answer one-off questions without a new dashboard.",
 context:"A semantic layer is the engine, but for most users the value shows in the interface. Many tools make a chart look good; the challenge is making it functional, transparent and flexible.",
 problem:"Three recurring headaches: the black-box number nobody can explain without the developer; the all-or-nothing filter that changes every chart, including the ones meant to stay as a benchmark; and the dashboard built for days to answer a question the user needed once.",
 approach:["Drill-through: click any data point to see the row-level data behind it. Developers get an instant audit; users get autonomy, and links can lead to external apps such as the CRM.","Granular filter control: choose which tiles a filter applies to (“Tiles to update”), for example a filtered region next to a static global average. Trade-off: the configuration needs discipline or troubleshooting gets hard.","Ad-hoc exploration: in Explore, users drag and drop fields, answer their question and export to CSV, keeping the dashboard estate clean."],
 principles:[["Transparency builds trust","A number people can drill into is a number people stop disputing."],["Flexibility needs discipline","Fine-grained configuration is powerful and must be documented to stay maintainable."],["Not every question needs a dashboard","Self-service for one-off questions frees developers for architecture work."]]},
zh:{title:"三个解决日常看板痛点的 Looker 功能",
 tldr:"下钻回答「这个数是怎么算的」，按图块控制筛选让基准保持稳定，Explore 让用户不建新看板也能回答一次性问题。",
 context:"语义层是引擎，但对大多数用户来说，价值体现在界面上。很多工具都能把图做得好看，难的是让它好用、透明、灵活。",
 problem:"三个反复出现的痛点：没有开发就没人能解释的「黑盒」数字；一刀切的筛选器，连本应保持不变的基准图也跟着变；花几天做出来的看板，只是为了回答用户一次性的问题。",
 approach:["下钻（Drill-through）：点击任意数据点，查看背后的明细行。开发者获得即时审计手段，用户获得自主权，还可以链接到 CRM 等外部应用。","细粒度筛选控制：指定筛选器作用于哪些图块（「Tiles to update」），例如筛选后的区域旁边放一个静态的全局平均值。代价是配置需要纪律，否则排查会很难。","临时探索：在 Explore 里，用户拖拽字段、得到答案并导出 CSV，看板环境保持整洁。"],
 principles:[["透明带来信任","可以下钻的数字，人们就不再争论。"],["灵活需要纪律","细粒度配置很强大，必须有文档才能维护。"],["不是每个问题都需要看板","一次性问题交给自助分析，让开发者把时间留给架构。"]]},
fr:{title:"Trois fonctionnalités Looker contre les maux quotidiens des dashboards",
 tldr:"Le drill-through répond à « comment ce chiffre est-il calculé ? », le contrôle des filtres par tuile garde les références stables, et l'Explore répond aux questions ponctuelles sans nouveau dashboard.",
 context:"La couche sémantique est le moteur, mais pour la plupart des utilisateurs la valeur se voit dans l'interface. Beaucoup d'outils font de jolis graphiques ; le défi est de les rendre fonctionnels, transparents et flexibles.",
 problem:"Trois maux récurrents : le chiffre « boîte noire » que personne n'explique sans le développeur ; le filtre tout-ou-rien qui change chaque graphique, y compris ceux qui devaient rester une référence ; et le dashboard construit en plusieurs jours pour une question posée une seule fois.",
 approach:["Drill-through : cliquer sur un point pour voir les lignes détaillées derrière. Audit instantané pour le développeur, autonomie pour l'utilisateur, avec des liens possibles vers des applications externes comme le CRM.","Contrôle fin des filtres : choisir les tuiles concernées par un filtre (« Tiles to update »), par exemple une région filtrée à côté d'une moyenne globale fixe. Contrepartie : une configuration qui demande de la rigueur.","Exploration ad hoc : dans l'Explore, l'utilisateur glisse-dépose ses champs, obtient sa réponse et exporte en CSV, sans encombrer l'espace des dashboards."],
 principles:[["La transparence crée la confiance","Un chiffre qu'on peut explorer est un chiffre qu'on ne conteste plus."],["La flexibilité exige de la rigueur","Une configuration fine est puissante et doit être documentée."],["Toute question ne mérite pas un dashboard","Le libre-service pour le ponctuel libère du temps pour l'architecture."]]}},

/* T. Beyond dashboards (02-02) */
"7424003613808648192":{domain:"semantic",also:["platform"],series:"looker",fig:"lookml",article:"https://medium.com/@gabrielluz1564/beyond-dashboards-a-deep-dive-into-lookers-underlying-logic-ee308ab46e06",stack:["Looker","LookML","Git"],concepts:["ssot","git","envs","access","selfservice"],
en:{title:"Beyond dashboards: how Looker's semantic layer is built",
 tldr:"Views define dimensions and measures, Explores define joins once, Models bind them to a connection and audience. Add Git, dev / prod modes and roles, and business rules stop hiding inside single dashboards.",
 context:"Teams often spend more time fixing dashboards than analysing them: updating the same metric in ten reports, debating whose number is right, rebuilding a dashboard for a simple ad-hoc question. These are signs of a maintenance trap.",
 problem:"In traditional BI tools a formula is often hard-coded inside one dashboard for a one-off request. Without documentation, the reason disappears, and the next person inherits black-box logic that is hard to maintain or change.",
 approach:["Views: atomic logic per table, with dimensions (the what) and measures (the how much), e.g. a total_revenue measure of type sum.","Explores: join views once so users never write SQL joins. Models: bind Explores to a database connection and decide who sees what.","Dashboards as code: everything is versioned in Git, business rules are reviewable, and changing total_revenue once updates every dashboard that uses it.","Development mode vs production mode: a private sandbox to change logic without breaking the truth users rely on.","Roles: developers build LookML, users explore and build their own dashboards without SQL, viewers consume and filter."],
 principles:[["Rules belong in a shared layer","A rule hidden in one report becomes a legacy mystery for every new joiner."],["Separate experimenting from serving","A sandbox protects the version the business depends on."],["Shield users by role","Give each audience the level of power it needs, no more."]]},
zh:{title:"超越看板：Looker 语义层是如何构建的",
 tldr:"View 定义维度和度量，Explore 一次性定义关联，Model 把它们绑定到连接和受众。再加上 Git、开发 / 生产模式和角色权限，业务规则就不会再藏在某一个看板里。",
 context:"团队常常花在修看板上的时间比分析还多：同一个指标要在十个报表里手工更新，开会争论谁的数字对，一个简单的临时问题也要开发重建整个看板。这些都是「维护陷阱」的征兆。",
 problem:"在传统 BI 工具里，公式常常为了一次性需求被硬编码在某个看板里。没有文档，改动的原因就消失了，下一个接手的人继承的是难以维护的黑盒逻辑。",
 approach:["View：按表定义原子逻辑，包括维度（是什么）和度量（有多少），例如类型为 sum 的 total_revenue。","Explore：一次性定义视图之间的关联，用户无需手写 SQL JOIN。Model：把 Explore 绑定到数据库连接，并决定谁能看到什么。","看板即代码：一切都在 Git 中版本化，业务规则可评审；修改一次 total_revenue，所有用到它的看板同步更新。","开发模式 vs 生产模式：私人沙箱里改逻辑，不会破坏业务依赖的「事实」。","角色：开发者编写 LookML，普通用户无需 SQL 即可探索并搭建自己的看板，查看者只能浏览和筛选。"],
 principles:[["规则属于共享层","藏在某个报表里的规则，会成为每个新人眼中的历史谜团。"],["把试验和服务分开","沙箱保护业务所依赖的那个版本。"],["按角色屏蔽复杂度","给每类受众恰好够用的能力。"]]},
fr:{title:"Au-delà des dashboards : comment est construite la couche sémantique de Looker",
 tldr:"Les Views définissent dimensions et mesures, les Explores définissent les jointures une fois, les Models les relient à une connexion et à un public. Avec Git, les modes dev / prod et les rôles, les règles métier cessent de se cacher dans un seul dashboard.",
 context:"Les équipes passent souvent plus de temps à réparer des dashboards qu'à les analyser : mettre à jour la même métrique dans dix rapports, débattre du « bon » chiffre, reconstruire un dashboard pour une simple question ad hoc. Ce sont les signes d'un piège de maintenance.",
 problem:"Dans les outils BI traditionnels, une formule est souvent codée en dur dans un dashboard pour une demande ponctuelle. Sans documentation, la raison disparaît et le suivant hérite d'une logique boîte noire difficile à maintenir.",
 approach:["Views : logique atomique par table, avec dimensions (le quoi) et mesures (le combien), par exemple une mesure total_revenue de type sum.","Explores : joindre les vues une fois pour que personne n'écrive de JOIN. Models : relier les Explores à une connexion et décider qui voit quoi.","Dashboards as code : tout est versionné dans Git, les règles sont relues, et modifier total_revenue une fois met à jour tous les dashboards qui l'utilisent.","Mode développement vs production : un bac à sable privé pour changer la logique sans casser la vérité utilisée par le métier.","Rôles : les développeurs écrivent le LookML, les utilisateurs explorent et créent leurs dashboards sans SQL, les viewers consultent et filtrent."],
 principles:[["Les règles vivent dans une couche partagée","Une règle cachée dans un rapport devient un mystère pour chaque nouvel arrivant."],["Séparer l'expérimentation du service","Un bac à sable protège la version dont dépend le métier."],["Protéger l'utilisateur par son rôle","Donner à chaque public le pouvoir dont il a besoin, pas plus."]]}},

/* U. First article (01-27) */
"7422030713971191809":{domain:"semantic",also:["platform"],series:"looker",article:"https://medium.com/@gabrielluz1564/bridging-data-engineering-and-business-intelligence-the-strategic-role-of-the-looker-semantic-89c160932967",stack:["Looker","LookML","Git","GitLab CI/CD"],concepts:["ssot","git","metricDef"],
en:{title:"The semantic layer as the bridge between data engineering and BI",
 tldr:"The hard part is consistency, not scale. When “Revenue” is re-coded in every query and dashboard, each change becomes a manual audit. Define it once, as versioned code.",
 context:"Across several organisations' pipelines and BI projects, the same challenge kept returning: business logic fragmented across disconnected queries, dbt models and dashboard settings. Few tools bring data development practices such as version control and governance into the visualisation workflow.",
 problem:"Definitions like “Revenue” or “Active users” are hard-coded in many places. When a core metric changes, analysts have to find and update every report by hand: slow, error-prone, and corrosive to trust.",
 approach:["Use the semantic layer as the bridge: physical tables become Views and Explores, dimensions and measures are defined once as code, and every department reads the same metrics.","Let Looker send optimised SQL to the warehouse instead of moving data, so the presentation layer stays current and governed.","Bring software practice to BI with Git: tracked and reviewed metric changes, development mode on branches, and CI/CD (e.g. GitLab) so only validated code reaches users."],
 principles:[["Consistency is the real scaling problem","More data is manageable; more versions of the same metric are not."],["Governance is architecture, not policy","It works when the platform makes the single definition the default."],["From static reports to governed platforms","The learning curve of code-based modelling pays back in confidence."]]},
zh:{title:"语义层：连接数据工程与 BI 的桥梁",
 tldr:"难的是一致性，而不是规模。当「收入」在每条查询和每个看板里各写一遍，每次变更都成了一次手工审计。只定义一次，并作为版本化的代码。",
 context:"在多个组织的数据管道和 BI 项目中，我反复遇到同一个挑战：业务逻辑分散在互不相连的查询、dbt 模型和看板配置里。很少有工具能把版本控制、治理这些数据开发实践带进可视化流程。",
 problem:"「收入」「活跃用户」这类定义被硬编码在很多地方。核心指标一变，分析师就得手工找出并更新每张报表：慢、易错，而且会侵蚀信任。",
 approach:["用语义层做桥梁：物理表变成 View 和 Explore，维度和度量作为代码只定义一次，每个部门看到同一套指标。","让 Looker 把优化后的 SQL 直接发到数仓，而不是搬运数据，展示层因此保持实时且受治理。","用 Git 把软件工程实践带进 BI：指标变更可追踪、可评审，在分支上的开发模式里试验，再通过 CI/CD（如 GitLab）只把验证过的代码推给用户。"],
 principles:[["一致性才是真正的扩展难题","数据多了可以应对；同一指标的版本多了却不行。"],["治理是架构，不是制度","当平台让唯一定义成为默认，治理才真正生效。"],["从静态报表走向受治理的平台","代码化建模的学习成本，会以信心的形式回报。"]]},
fr:{title:"La couche sémantique, pont entre data engineering et BI",
 tldr:"La vraie difficulté n'est pas l'échelle mais la cohérence. Quand le « Revenue » est recodé dans chaque requête et chaque dashboard, chaque changement devient un audit manuel. Le définir une fois, en code versionné.",
 context:"Sur les pipelines et projets BI de plusieurs organisations, le même défi revenait : une logique métier fragmentée entre requêtes, modèles dbt et paramètres de dashboards. Peu d'outils intègrent des pratiques de développement comme le versioning et la gouvernance dans le flux de visualisation.",
 problem:"Des définitions comme « Revenue » ou « Utilisateurs actifs » sont codées en dur à de nombreux endroits. Quand une métrique clé change, il faut retrouver et corriger chaque rapport à la main : lent, risqué, et nuisible à la confiance.",
 approach:["Faire de la couche sémantique le pont : les tables physiques deviennent Views et Explores, dimensions et mesures sont définies une fois en code, et chaque département lit les mêmes métriques.","Laisser Looker envoyer un SQL optimisé à l'entrepôt plutôt que déplacer la donnée, pour une présentation à jour et gouvernée.","Apporter les pratiques logicielles à la BI avec Git : changements de métriques tracés et relus, mode développement sur branches, et CI/CD (ex. GitLab) pour ne livrer que du code validé."],
 principles:[["La cohérence est le vrai défi d'échelle","Plus de données se gère ; plus de versions d'une même métrique, non."],["La gouvernance est une architecture, pas une politique","Elle fonctionne quand la plateforme fait de la définition unique le chemin par défaut."],["Des rapports statiques aux plateformes gouvernées","La courbe d'apprentissage du code se rembourse en sérénité."]]}}
});

  b+=R(474,40,120,60,"f-soft")+T(534,66,"BigQuery","f-t","middle")+T(534,86,L[2],"f-s-sm","middle")+Ln(596,70,624,70);
  b+=R(626,40,110,60,"f-soft")+T(681,66,"Looker Studio","f-t","middle")+T(681,86,L[3],"f-s-sm","middle");
  return svgWrap(736,136,b);},
lookml:L=>{let b="";const w=150,g=26;
  for(let i=0;i<4;i++){const x=i*(w+g);b+=R(x,10,w,60,i===1?"f-accsoft":"f-soft")+T(x+w/2,36,L[i][0],"f-t","middle")+T(x+w/2,56,L[i][1],"f-s-sm","middle");if(i<3)b+=Ln(x+w+2,40,x+w+g-2,40);}
  b+=R(0,86,4*w+3*g,26,"f-pill",13)+T((4*w+3*g)/2,103,L[4],"f-s","middle");return svgWrap(4*w+3*g,120,b);}
});

const MON={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],fr:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."]};
const fmtDate=(iso,l)=>{const d=new Date(iso+"T12:00:00");return l==="zh"?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`:`${d.getDate()} ${MON[l][d.getMonth()]} ${d.getFullYear()}`;};

// ---------- data ----------
const D=Object.fromEntries(DOMAINS.map(d=>[d.id,d]));
const ALLPOSTS=[...POSTS,...POSTS2].sort((a,b)=>b.date.localeCompare(a.date));
const notes=ALLPOSTS.map((p,i)=>{
  const lines=p.text.split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines[lines.length-1].startsWith("#")) lines.pop();
  return {also:[],...NOTES[p.id],id:p.id,date:p.date,olang:p.olang||"en",orig:lines,raw:p.text,order:i};
});
const byId=Object.fromEntries(notes.map(n=>[n.id,n]));
const inDomain=id=>[...notes.filter(n=>n.domain===id),...notes.filter(n=>n.also.includes(id))];
const conceptNotes={};notes.forEach(n=>n.concepts.forEach(c=>(conceptNotes[c]=conceptNotes[c]||[]).push(n.id)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const codeify=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\b(persist_for|sql_trigger_value|primary_key: yes|extends:|delivered_at − shipped_at|LAG\/LEAD|UNION ALL|fct_|dim_|agg_|\.json)/g,"<code>$1</code>");

// ---------- state ----------
let lang="en";
try{const s=localStorage.getItem("debrief-lang");if(UI[s])lang=s;else{const n=(navigator.language||"").slice(0,2);if(UI[n])lang=n;}}catch(e){}
let view={kind:"home"},q="",focusConcept=null;
const t=k=>UI[lang][k], N=n=>n[lang];

// ---------- render pieces ----------
function renderSide(){
  document.documentElement.lang=lang==="zh"?"zh-CN":lang;
  document.getElementById("def").innerHTML=t("def");
  document.getElementById("by").innerHTML=t("by");
  document.getElementById("q").placeholder=t("search");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const cur=view.kind==="domain"?view.id:view.kind==="note"?byId[view.id].domain:view.kind;
  document.getElementById("nav").innerHTML=
   `<button data-go="home" aria-current="${!q&&cur==="home"}"><span class="lbl">${t("overview")}</span><span class="n">${notes.length}</span></button>
    <div class="eyebrow nav-label">${t("domains")}</div>`+
   DOMAINS.map(d=>`<button data-go="domain:${d.id}" aria-current="${!q&&cur===d.id}"><span class="lbl"><span class="sw" style="background:${d.color}"></span>${d.name[lang]}</span><span class="n">${inDomain(d.id).length}</span></button>`).join("")+
   `<div class="eyebrow nav-label">${t("index")}</div><button data-go="concepts" aria-current="${!q&&cur==="concepts"}"><span class="lbl">${t("concepts")}</span><span class="n">${Object.keys(conceptNotes).length}</span></button>`;
}
const card=n=>{const c=N(n);return `<button class="card" data-go="note:${n.id}">
  <div class="top"><span><span class="sw" style="background:${D[n.domain].color};width:8px;height:8px"></span>${D[n.domain].name[lang]}</span><span>${fmtDate(n.date,lang)}</span></div>
  <h3>${esc(c.title)}</h3><p>${esc(c.tldr)}</p>
  <div class="tagrow">${n.stack.slice(0,3).map(s=>`<span class="tag stack">${esc(s)}</span>`).join("")}${n.fig?`<span class="hasfig">${t("hasfig")}</span>`:""}${n.series?`<span class="hasfig">▤ ${esc(SERIES[n.series].name[lang])}</span>`:""}</div></button>`;};

function home(){
  return `<div class="eyebrow">${t("eyebrow")(notes.length)}</div>
  <h1>${t("h1")}</h1><p class="intro">${t("intro")}</p>
  <div class="domains">${DOMAINS.map(d=>{const ns=inDomain(d.id);return `<button class="domain" data-go="domain:${d.id}">
     <h3><span class="sw" style="background:${d.color}"></span>${d.name[lang]}</h3><p>${d.blurb[lang]}</p>
     <ul>${ns.slice(0,3).map(n=>`<li>${esc(N(n).title)}</li>`).join("")}</ul>
     <span class="eyebrow">${t("notes")(ns.length)}</span></button>`}).join("")}</div>
  <div class="section-h"><h2>${t("seriesH")}</h2></div>
  <div class="domains">${Object.entries(SERIES).map(([k,s])=>`<div class="domain series-card"><h3>▤ ${esc(s.name[lang])}</h3><ol>${s.ids.map(id=>`<li><button data-go="note:${id}">${esc(N(byId[id]).title)}</button></li>`).join("")}</ol></div>`).join("")}</div>
  <div class="section-h"><h2>${t("latest")}</h2></div>
  <div class="cards">${notes.slice(0,4).map(card).join("")}</div>`;
}
function domainView(id){
  const d=D[id],prim=notes.filter(n=>n.domain===id),sec=notes.filter(n=>n.also.includes(id));
  return `<div class="crumbs"><button data-go="home">${t("overview")}</button><span>/</span><span>${d.name[lang]}</span></div>
  <h1><span class="sw" style="background:${d.color};width:14px;height:14px;margin-right:10px;vertical-align:middle"></span>${d.name[lang]}</h1>
  <p class="intro">${d.blurb[lang]}</p>
  <div class="cards">${prim.map(card).join("")||`<div class="empty">${t("none")}</div>`}</div>
  ${sec.length?`<div class="section-h"><h2>${t("also")}</h2></div><div class="cards">${sec.map(card).join("")}</div>`:""}`;
}
function conceptsView(){
  const keys=Object.keys(conceptNotes).sort((a,b)=>CONCEPTS[a][lang].localeCompare(CONCEPTS[b][lang],lang));
  return `<div class="crumbs"><button data-go="home">${t("overview")}</button><span>/</span><span>${t("concepts")}</span></div>
  <h1>${t("concepts")}</h1><p class="intro">${t("conceptsIntro")}</p>
  <div class="concepts">${keys.map(k=>`<div class="concept${k===focusConcept?" on":""}" id="c-${k}"><b>${esc(CONCEPTS[k][lang])} · ${conceptNotes[k].length}</b>${conceptNotes[k].map(id=>`<button data-go="note:${id}">${esc(N(byId[id]).title)}</button>`).join("")}</div>`).join("")}</div>`;
}
function related(n){
  const out=[];
  notes.forEach(m=>{if(m.id===n.id||(n.series&&m.series===n.series))return;
    const shared=m.concepts.filter(c=>n.concepts.includes(c));
    if(shared.length) out.push([m,CONCEPTS[shared[0]][lang],2+shared.length]);
    else if(m.domain===n.domain) out.push([m,D[m.domain].name[lang],1]);});
  return out.sort((a,b)=>b[2]-a[2]).slice(0,4);
}
function noteView(id){
  const n=byId[id],c=N(n),d=D[n.domain],rel=related(n);
  const fig=n.fig?`<div class="block"><h2>${t("diagram")}</h2><figure>${FIG[n.fig](FIGL[n.fig][lang])}</figure></div>`:"";
  return `<div class="crumbs"><button data-go="home">${t("overview")}</button><span>/</span><button data-go="domain:${d.id}">${d.name[lang]}</button></div>
  <article class="note">
    <div class="note-head">
      <div class="eyebrow">${fmtDate(n.date,lang)}${n.also.length?" · "+t("alsoIn")+" "+n.also.map(a=>D[a].name[lang]).join(", "):""}</div>
      <h1>${esc(c.title)}</h1>
      <p class="tldr">${esc(c.tldr)}</p>
    </div>
    ${n.series?(()=>{const s=SERIES[n.series],i=s.ids.indexOf(n.id);return `<div class="series"><div class="eyebrow">${t("series")} · ${esc(s.name[lang])} · ${t("part")(i+1,s.ids.length)}</div><ol>${s.ids.map(id=>`<li>${id===n.id?`<b>${esc(N(byId[id]).title)}</b>`:`<button data-go="note:${id}">${esc(N(byId[id]).title)}</button>`}</li>`).join("")}</ol></div>`})():""}
    <div class="story">
      <div class="fact"><div class="eyebrow">${t("context")}</div><p>${codeify(c.context)}</p></div>
      <div class="fact prob"><div class="eyebrow">${t("problem")}</div><p>${codeify(c.problem)}</p></div>
    </div>
    ${fig}
    <div class="block"><h2>${t("approach")}</h2><ul class="steps">${c.approach.map(s=>`<li><span>${codeify(s)}</span></li>`).join("")}</ul></div>
    <div class="block"><h2>${t("principles")}</h2><div class="principles">${c.principles.map(([h,p])=>`<div class="pr"><b>${esc(h)}</b><span>${codeify(p)}</span></div>`).join("")}</div></div>
    <div class="meta-grid">
      <div class="block"><h2>${t("stack")}</h2><div class="tagrow">${n.stack.map(s=>`<span class="tag stack">${esc(s)}</span>`).join("")}</div></div>
      <div class="block"><h2>${t("conc")}</h2><div class="tagrow">${n.concepts.map(k=>`<button class="tag" data-go="concepts:${k}">${esc(CONCEPTS[k][lang])}</button>`).join("")}</div></div>
    </div>
    ${rel.length?`<div class="block"><h2>${t("related")}</h2><div class="related">${rel.map(([m,why])=>`<button data-go="note:${m.id}"><span class="why">${esc(why)}</span><span>${esc(N(m).title)}</span></button>`).join("")}</div></div>`:""}
    ${n.article?`<a class="open" href="${n.article}" target="_blank" rel="noopener">${t("article")}</a>`:""}
    <details><summary>${t("orig")} · ${t("ol")[n.olang]||n.olang}</summary><div class="orig">${n.orig.map(l=>`<p>${esc(l)}</p>`).join("")}
      <a class="open" href="https://www.linkedin.com/feed/update/urn:li:activity:${n.id}/" target="_blank" rel="noopener">${t("open")}</a></div></details>
  </article>`;
}
function searchView(){
  const s=q.toLowerCase();
  const hits=notes.filter(n=>{const all=["en","zh","fr"].map(l=>{const c=n[l];return [c.title,c.tldr,c.context,c.problem,c.approach.join(" "),c.principles.flat().join(" ")].join(" ")}).join(" ");
    return (all+" "+n.stack.join(" ")+" "+n.concepts.map(k=>Object.values(CONCEPTS[k]).join(" ")).join(" ")+" "+n.raw).toLowerCase().includes(s);});
  return `<div class="eyebrow">${t("search_e")}</div><h1>${esc(t("results")(hits.length,q))}</h1>
  <div class="cards">${hits.map(card).join("")||`<div class="empty">${t("noresult")}</div>`}</div>`;
}

// ---------- routing ----------
function render(){
  document.getElementById("main").innerHTML= q?searchView(): view.kind==="domain"?domainView(view.id): view.kind==="note"?noteView(view.id): view.kind==="concepts"?conceptsView(): home();
  renderSide();
}
function go(target){
  const [k,id]=target.split(":");
  focusConcept=k==="concepts"?id||null:null;
  view={kind:k,id:k==="concepts"?undefined:id}; q=""; document.getElementById("q").value="";
  try{history.replaceState(null,"",k==="home"?location.pathname:"#"+k+(id&&k!=="concepts"?"-"+id:""));}catch(e){}
  render();
  if(focusConcept){const el=document.getElementById("c-"+focusConcept);if(el)el.scrollIntoView({block:"center"});}else window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-lang]");if(l){lang=l.dataset.lang;try{localStorage.setItem("debrief-lang",lang);}catch(err){}render();return;}
  const b=e.target.closest("[data-go]");if(b){e.preventDefault();go(b.dataset.go);}
});
document.getElementById("home").addEventListener("click",()=>go("home"));
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim();render();});
try{const h=location.hash.slice(1),m=h.match(/^(domain|note)-(.+)$/);
  if(m&&(m[1]==="domain"?D[m[2]]:byId[m[2]])) view={kind:m[1],id:m[2]}; else if(h==="concepts") view={kind:"concepts"};}catch(e){}
render();
</script>
